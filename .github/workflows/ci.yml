name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gate-guard reads the pull request's labels and the owner's label events. A
  # called workflow can't hold more than its caller grants.
  issues: read
  pull-requests: read

jobs:
  # Linux and Windows, because the owner and workers develop on Windows and
  # #87 and #28 were Windows-only. The Windows leg's pytest run includes the
  # launcher lifecycle on real sockets (tests/test_ui_lifecycle.py).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test with coverage
        run: pytest --cov=musicdiscovery --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload Python coverage for SonarCloud
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
      # The console smoke keeps the runner's default encoding. Setting
      # PYTHONIOENCODING or PYTHONUTF8 here would hide #28's class of crash.
      - name: Build a catalog with titles a legacy console cannot encode
        if: runner.os == 'Windows'
        run: python scripts/build_console_catalog.py data/console-smoke
      - name: Check the console is not UTF-8, so the smoke can catch a crash
        if: runner.os == 'Windows'
        # A block scalar, so YAML does not read " #28" below as a comment.
        run: |
          python -c "import sys; e = sys.stdout.encoding; print('stdout encoding:', e); sys.exit('::error::stdout is UTF-8, so the smoke cannot catch #28' if e.lower() == 'utf-8' else 0)"
      - name: Recommend from that catalog to the runner's console
        if: runner.os == 'Windows'
        run: musicdiscovery recommend --data-dir data/console-smoke --seed 100 -k 5

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Build the demo bundle from the synthetic catalog
        run: python scripts/build_demo_fixture.py .demo-fixture
      - name: Check the bundle is stamped with the commit under test
        run: |
          sha=$(python -c 'import json; print(json.load(open(".demo-fixture/SOURCE.json"))["sha"])')
          echo "SOURCE.json sha: $sha"
          test "$sha" = "$GITHUB_SHA"
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the JavaScript rankers against Python
        run: npm run test:parity
      - name: Check the study logic
        run: npm run test:study
      - name: Check the pages in a browser under the site's CSP
        run: npm run test:browser
        env:
          STUDY_EXPORT_DIR: .study-fixture
          COVERAGE_DIR: coverage-js
      - name: Upload JavaScript coverage for SonarCloud
        uses: actions/upload-artifact@v7
        with:
          name: coverage-js
          path: coverage-js/lcov.info
          if-no-files-found: error
      - name: Analyse the synthetic session the browser test exported
        run: musicdiscovery analyze-study .study-fixture --out-dir .study-fixture/report

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install synthetic fixture and UI test tools
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Test passing UI journeys and responsive layouts
        run: npm run test:ui -- --workers=1
      - name: Stop only the owned disposable instance
        if: always()
        run: npm run ui:stop
      - name: Upload UI reports and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # The shared gate guard, called at a full SHA of dflippojr/.github main;
  # guard-ref names the same SHA, so the script that judges the pull request is
  # the one that was reviewed. It fails a pull request that deletes or skips
  # tests, adds retries, or edits workflows, coverage or Sonar config, unless
  # the owner applied gate-change-approved. Labels are read when the job runs:
  # after the owner applies one, re-run this job. This job is an early signal
  # inside gate, not the judge: a pull request can replace it, and it accepts a
  # label applied before the newest push. The judge is the gate-guard check
  # that gate-guard-target.yml posts from main.
  gate-guard:
    uses: dflippojr/.github/.github/workflows/gate-guard.yml@e2c7fae8508be0359f3abaf136caade46ee7479c
    with:
      guard-ref: e2c7fae8508be0359f3abaf136caade46ee7479c
      require-owner-label-actor: true

  # The check to require, next to gate-guard. It always runs and passes only
  # when every job above passed, both test legs included, so a failed,
  # cancelled or skipped job turns it red.
  gate:
    name: gate
    needs: [test, demo, ui, gate-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every CI job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::These CI jobs did not pass: $failed"
            exit 1
          fi
