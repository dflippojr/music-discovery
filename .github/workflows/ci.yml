name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test with coverage
        run: pytest --cov=musicdiscovery --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload Python coverage for SonarCloud
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"
      - name: Build the demo bundle from the synthetic catalog
        run: python scripts/build_demo_fixture.py .demo-fixture
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check the JavaScript rankers against Python
        run: npm run test:parity
      - name: Check the study logic
        run: npm run test:study
      - name: Check the pages in a browser under the site's CSP
        run: npm run test:browser
        env:
          STUDY_EXPORT_DIR: .study-fixture
          COVERAGE_DIR: coverage-js
      - name: Upload JavaScript coverage for SonarCloud
        uses: actions/upload-artifact@v7
        with:
          name: coverage-js
          path: coverage-js/lcov.info
          if-no-files-found: error
      - name: Analyse the synthetic session the browser test exported
        run: musicdiscovery analyze-study .study-fixture --out-dir .study-fixture/report

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install synthetic fixture and UI test tools
        run: |
          python -m pip install -e ".[dev]"
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Test passing UI journeys and responsive layouts
        run: npm run test:ui -- --workers=1
      - name: Stop only the owned disposable instance
        if: always()
        run: npm run ui:stop
      - name: Upload UI reports and failure traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
