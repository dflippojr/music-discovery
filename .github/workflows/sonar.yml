name: SonarCloud

# Takes the Python and browser coverage that ci.yml produces for the same
# commit and performs the SonarCloud analysis, so Automatic Analysis must stay
# off in the SonarCloud project. The quality gate fails this check through
# sonar.qualitygate.wait.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

# A new push cancels a superseded PR run. Runs on main are never cancelled, so
# every merge is analysed even when several land together.
concurrency:
  group: sonar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  sonar:
    runs-on: ubuntu-latest
    # Fork PRs cannot access secrets. Same-repository Dependabot PRs use the
    # Dependabot secret SONARCLOUD_TOKEN; other runs use the Actions secret.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      HAS_SONARCLOUD_TOKEN: ${{ secrets.SONARCLOUD_TOKEN != '' }}
    steps:
      - name: Note missing token
        if: env.HAS_SONARCLOUD_TOKEN != 'true'
        run: |
          echo "::notice::SONARCLOUD_TOKEN is not set for this event; skipping SonarCloud analysis. No analysis or quality gate result was produced. Configure the Actions or Dependabot secret as appropriate."
          echo "SonarCloud analysis skipped: SONARCLOUD_TOKEN is absent for this event. No analysis or quality gate result was produced. Configure the Actions or Dependabot secret as appropriate." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.HAS_SONARCLOUD_TOKEN == 'true'
        with:
          # Full history so SonarCloud can blame lines and find the PR base.
          fetch-depth: 0

      - name: Fetch coverage from the CI run for this commit
        if: env.HAS_SONARCLOUD_TOKEN == 'true'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # ci.yml already runs both suites with coverage and uploads the reports.
          # Wait for that run's artifacts instead of running the suites a second time.
          run_id=""
          while true; do
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$SHA" --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq '.artifacts[] | select(.expired | not) | .name')
              if grep -qx coverage-xml <<< "$names" && grep -qx coverage-js <<< "$names"; then
                break
              fi
              status=$(gh run view "$run_id" -R "$GITHUB_REPOSITORY" --json status --jq .status)
              if [ "$status" = completed ]; then
                echo "::error::CI run $run_id finished without both coverage artifacts. SonarCloud needs the CI test and demo jobs to pass."
                exit 1
              fi
            fi
            sleep 20
          done
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" --name coverage-xml --dir .
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" --name coverage-js --dir coverage-js

      - name: Scan with SonarCloud
        if: env.HAS_SONARCLOUD_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.qualitygate.wait=true
