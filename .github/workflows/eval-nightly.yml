name: Evaluation gate, nightly

# Runs the ranker-quality gate (eval-gate.yml) on main every night, so a change
# that slips past the path filter, or a catalog or dependency change, still
# shows up. Scheduled runs use the default branch.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-gate:
    uses: ./.github/workflows/eval-gate.yml
    with:
      always: true
