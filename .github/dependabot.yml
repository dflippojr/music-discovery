version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /
      # Module-type manifest; currently has no dependencies to update.
      - /src/musicdiscovery/demo
    schedule:
      interval: weekly
    groups:
      npm-dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
