[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musicdiscovery"
version = "0.1.0"
description = "Music discovery over a fixed, openly licensed catalog"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pandas>=2.2", "pyarrow>=17"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9"]

[project.scripts]
musicdiscovery = "musicdiscovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
