[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "musicdiscovery"
version = "0.1.0"
description = "Music discovery over a fixed, openly licensed catalog"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=17", "jsonschema>=4.18"]

[project.optional-dependencies]
audio = ["sentence-transformers>=6.1", "torch>=2.6", "pillow>=10", "av>=14"]
dev = ["pytest>=8", "pytest-cov>=6", "ruff>=0.9", "psutil>=6", "av>=14"]

[project.scripts]
musicdiscovery = "musicdiscovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musicdiscovery = ["hybrid_config.json", "profile_ranker.json", "study-ratings.schema.json", "feedback-log.schema.json", "demo/*.html", "demo/*.css", "demo/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
